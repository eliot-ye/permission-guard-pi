# Publishes permission-guard-pi to npm with provenance via Trusted Publishing (OIDC).
#
# Trigger: "Run workflow" button on GitHub Actions, then pick the tag to publish.
# Required one-time setup:
#   1. npm account has 2FA enabled.
#   2. On npmjs.com → package → Settings → Trusted Publishing, add a publisher
#      pointing at this repo's workflow file.
# After that, npm publishes via short-lived OIDC tokens — no NPM_TOKEN secret,
# no interactive OTP during CI runs.
#
# Pre-publish gates run in-order: typecheck → tests → publish.

name: publish

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Annotated git tag to publish (e.g. v0.1.2)"
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout at requested tag
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Run tests
        run: npm test

      - name: Assert tag matches package.json version
        shell: bash
        run: |
          PKG_VERSION="$(node -p "require('./package.json').version")"
          TAG_VERSION="${{ inputs.tag }}"
          EXPECTED="v${PKG_VERSION}"
          if [ "$TAG_VERSION" != "$EXPECTED" ]; then
            echo "Tag '$TAG_VERSION' does not match package.json version '$PKG_VERSION' (expected '$EXPECTED')" >&2
            exit 1
          fi
          echo "Tag matches: $TAG_VERSION == $EXPECTED"

      - name: Publish to npm
        run: npm publish --provenance
